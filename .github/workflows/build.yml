

name: Build LXG Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)
          unzip -o "$ZIP" -d project
          echo "Project extracted"
          ls -la project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LXG-Studio-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
