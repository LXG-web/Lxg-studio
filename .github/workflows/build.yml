

name: LXG Studio APK Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract APK ZIP
        run: |
          mkdir -p extracted apk-output
          ZIP=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -o "$ZIP" -d extracted

          APK=$(find extracted -type f -iname "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found inside ZIP. Files found:"
            find extracted -type f
            exit 1
          fi

          cp "$APK" apk-output/LXG-Studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LXG-Studio-APK
          path: apk-output/*.apk
          if-no-files-found: error
