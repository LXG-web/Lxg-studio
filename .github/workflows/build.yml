
name: Build LXG Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          unzip -o "$ZIP" -d project

      - name: Detect Gradle Version
        id: gradle_version
        run: |
          FILE=$(find project -name gradle-wrapper.properties | head -n 1)
          URL=$(grep '^distributionUrl=' "$FILE" | cut -d= -f2-)
          VERSION=$(echo "$URL" | grep -oE 'gradle-[0-9.]+-(bin|all)\.zip' | sed -E 's/gradle-([0-9.]+)-(bin|all)\.zip/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore project/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          ROOT=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          cd "$(dirname "$ROOT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LXG-Studio-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
