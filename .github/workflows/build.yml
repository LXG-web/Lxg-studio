
name: LXG Studio APK Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract APK ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "APK ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP" -d extracted

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LXG-Studio-APK
          path: extracted/**/*.apk
          if-no-files-found: error
          
